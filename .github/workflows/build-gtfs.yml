name: Build and publish warsaw.zip
on:
  schedule:
    # Daily, always after midnight Warsaw time (01:30 CEST / 00:30 CET), so that "today" in
    # ZTMFileProvider is the new day, the same as for mkuran's ~00:15 build.
    - cron: "30 23 * * *"
  workflow_dispatch:
permissions: {}
concurrency: build-gtfs
jobs:
  build:
    # Only on personal of this repository. The ztm environment is also restricted to personal,
    # and the AWS role only trusts this repository's ztm environment.
    if: github.repository == 'mccartney/WarsawGTFS' && github.ref == 'refs/heads/personal'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ztm
    permissions:
      contents: read
      id-token: write # to assume the AWS role via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # Dependencies are installed before, and without, the ZTM or AWS credentials.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          curl -fsSLo /tmp/ssm-plugin.deb \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/ssm-plugin.deb

      # Geofabrik downloads sometimes hang and get dropped, so keep the extract in the Actions cache.
      # A HEAD request checks whether Geofabrik has anything newer than the cached copy; if not,
      # the cache is used as is. Otherwise download, and on failure fall back to the cached copy as
      # long as its data is at most 5 days old. The file's mtime is Geofabrik's Last-Modified
      # (curl -R, preserved by the cache's tar). Either way the impuls metadata gets fetch_time=now,
      # so its TimeLimitedResource (3 days) uses this file instead of downloading again.
      # The cache holds only this public file.
      - name: Restore OSM extract from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: osm-cache
          key: osm-extract-
          restore-keys: osm-extract-

      # mazowieckie-latest redirects to the dated file, so follow it and take the last Last-Modified.
      # Any failure here just means "download".
      - name: Check for a newer OSM extract
        id: check
        run: |
          mkdir -p _impuls_workspace osm-cache
          [ -f osm-cache/mazowieckie-latest.osm.pbf ] || { echo "No cached copy"; exit 0; }
          remote=$(curl -fsSIL --retry 3 --retry-all-errors --connect-timeout 30 --max-time 120 \
            https://download.geofabrik.de/europe/poland/mazowieckie-latest.osm.pbf \
            | grep -i '^last-modified:' | tail -n 1 | cut -d ' ' -f 2- | tr -d '\r') || true
          remote_ts=$(date -d "$remote" +%s 2> /dev/null) && [ -n "$remote" ] \
            || { echo "::warning::HEAD request to Geofabrik failed"; exit 0; }
          cached_ts=$(stat -c %Y osm-cache/mazowieckie-latest.osm.pbf)
          echo "Geofabrik: $remote, cached: $(date -u -d "@$cached_ts")"
          if [ "$remote_ts" -le "$cached_ts" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download OSM extract
        id: osm
        if: steps.check.outputs.up_to_date != 'true'
        continue-on-error: true
        run: |
          curl -fsSLR --retry 3 --retry-all-errors --connect-timeout 30 --max-time 900 \
            -o osm-extract.tmp https://download.geofabrik.de/europe/poland/mazowieckie-latest.osm.pbf
          mv osm-extract.tmp osm-cache/mazowieckie-latest.osm.pbf

      - name: Save OSM extract to cache
        if: steps.osm.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: osm-cache
          key: osm-extract-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Put OSM extract into the impuls workspace
        env:
          OUTCOME: ${{ steps.check.outputs.up_to_date == 'true' && 'cached' || steps.osm.outcome }}
        run: |
          if [ ! -f osm-cache/mazowieckie-latest.osm.pbf ]; then
            echo "::error::OSM extract download failed and there is no cached copy"
            exit 1
          fi
          age=$(( $(date +%s) - $(stat -c %Y osm-cache/mazowieckie-latest.osm.pbf) ))
          case "$OUTCOME" in
            cached) echo "Geofabrik has nothing newer, using the cached copy from $(( age / 3600 ))h ago" ;;
            success) ;;
            *)
              if [ "$age" -gt $(( 5 * 86400 )) ]; then
                echo "::error::OSM extract download failed and the cached copy is $(( age / 3600 ))h old (limit 5 days)"
                exit 1
              fi
              echo "::warning::OSM extract download failed, using the cached copy from $(( age / 3600 ))h ago" ;;
          esac
          mv osm-cache/mazowieckie-latest.osm.pbf _impuls_workspace/
          printf '{"last_modified": %s, "fetch_time": %s}\n' \
            "$(stat -c %Y _impuls_workspace/mazowieckie-latest.osm.pbf)" "$(date +%s)" \
            > _impuls_workspace/mazowieckie-latest.osm.pbf.metadata

      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600

      # eta.ztm.waw.pl drops connections from GitHub's (US) runners. Relay them through a stopped-by-
      # default EC2 instance in eu-west-1 via SSM port forwarding: localhost:443 -> instance ->
      # eta.ztm.waw.pl:443, with the hostname pointed at localhost. TLS stays end-to-end, so the
      # certificate is still verified and the instance never sees the credentials.
      - name: Open tunnel to eta.ztm.waw.pl
        env:
          INSTANCE: ${{ vars.ZTM_TUNNEL_INSTANCE_ID }}
        run: |
          aws ec2 start-instances --instance-ids "$INSTANCE" > /dev/null
          aws ec2 wait instance-running --instance-ids "$INSTANCE"
          for i in $(seq 60); do
            sudo -E env "PATH=$PATH" aws ssm start-session --target "$INSTANCE" \
              --document-name AWS-StartPortForwardingSessionToRemoteHost \
              --parameters host=eta.ztm.waw.pl,portNumber=443,localPortNumber=443 \
              > tunnel.log 2>&1 &
            for j in $(seq 10); do
              if nc -z 127.0.0.1 443; then break 2; fi
              sleep 1
            done
            sudo kill $! 2> /dev/null || true  # agent not online yet, retry
            sleep 5
          done
          nc -z 127.0.0.1 443 || { cat tunnel.log; exit 1; }
          echo "127.0.0.1 eta.ztm.waw.pl" | sudo tee -a /etc/hosts
          echo "Tunnel check (401 expected): $(curl -m 20 -s -o /dev/null -w '%{http_code}' https://eta.ztm.waw.pl/apiversion)"

      # The only step that sees the ZTM credentials; the AWS ones are hidden from it. Don't add -v:
      # DEBUG logging would include HTTP request details. No artifacts: the workspace holds raw ZTM data.
      - name: Build GTFS
        env:
          WARSAW_ZTM_USER: ${{ secrets.WARSAW_ZTM_USER }}
          WARSAW_ZTM_PASS: ${{ secrets.WARSAW_ZTM_PASS }}
          WARSAW_ZTM_KEY: ${{ secrets.WARSAW_ZTM_KEY }}
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: python -m warsaw_gtfs --shapes -o warsaw.zip

      - name: Stop tunnel instance
        if: always() && steps.aws.outcome == 'success'
        run: aws ec2 stop-instances --instance-ids "${{ vars.ZTM_TUNNEL_INSTANCE_ID }}" > /dev/null

      - name: Set feed publisher
        run: >
          python tools/set_feed_publisher.py warsaw.zip
          --name "Grzegorz Olędzki's fork of mkuran"
          --url https://436.pl/gtfs/

      - name: Sanity-check against the published feed
        run: |
          if curl -fsSL -o previous.zip https://436.pl/gtfs/warsaw.zip; then
            python tools/check_gtfs.py warsaw.zip --previous previous.zip
          else
            echo "No previously published feed, checking without it"
            python tools/check_gtfs.py warsaw.zip
          fi

      - name: Publish to https://436.pl/gtfs/warsaw.zip
        run: |
          aws s3 cp warsaw.zip "s3://${{ vars.SITE_BUCKET }}/gtfs/warsaw.zip" \
            --content-type application/zip --cache-control max-age=3600
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" --paths '/gtfs/*'
